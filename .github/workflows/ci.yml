# Unit-Tests und Paketinhalt bei jedem Push und Pull Request, unter Linux und Windows.
# Das E2E braucht Docker und ein sichtbares Chrome (unter Linux per xvfb) und laeuft nachts oder von Hand.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  unit:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run pack:check

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CAW_AI_HOME: ${{ github.workspace }}/.caw-home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome und xvfb
        run: |
          google-chrome --version
          sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm run e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e
          path: |
            e2e/*.log
            e2e/*.png
          retention-days: 7
