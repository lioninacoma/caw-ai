# Stages a release on npm when a version tag (v*) is pushed, via npm trusted publishing (OIDC, no token): configured on
# npmjs.com for this repository and this workflow file (see CONTRIBUTING.md). The trusted publisher allows staging only:
# the version goes live once a maintainer approves it on npmjs.com (Staged Packages) or with npm stage approve, with 2FA.
name: Release

on:
  push:
    tags:
      - 'v*'

# Nothing beyond reading the repository by default; only the publish job gets the OIDC token.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and check the package
    runs-on: ubuntu-latest
    env:
      CAW_REQUIRE_CHROME: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Check package contents
        run: npm run pack:check

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing and provenance: npm authenticates and signs with the identity of this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # No dependency cache here: a cache another run wrote must not reach the job that signs and publishes.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Update npm
        # Staged publishing (npm stage) needs npm 11.15.0 or later; Node 22 ships npm 10. An exact version, not a range.
        run: npm install -g npm@11.15.0
      - name: Install dependencies
        # Without install scripts: no dependency runs code in the job that holds the publishing identity.
        run: npm ci --ignore-scripts
      - name: Publish
        # A version with a pre-release part (0.3.0-beta.1) goes to the "next" tag, not "latest".
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm stage publish --provenance --access public --tag next
          else
            npm stage publish --provenance --access public
          fi
