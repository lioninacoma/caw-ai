# Publishes to npm when a version tag (v*) is pushed, via npm trusted publishing (OIDC, no token): configured on
# npmjs.com for this repository and this workflow file (see CONTRIBUTING.md).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Trusted publishing and provenance: npm authenticates and signs with the identity of this workflow run.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      CAW_REQUIRE_CHROME: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Update npm
        # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Check package contents
        run: npm run pack:check
      - name: Publish
        # A version with a pre-release part (0.3.0-beta.1) goes to the "next" tag, not "latest".
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
