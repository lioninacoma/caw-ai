<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Payment</title></head>
  <body>
    <form aria-label="Card">
      <label>Amount <input id="amount" /></label>
      <button>Pay</button>
      <p role="status" id="status"></p>
    </form>
    <script>
      document.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault()
        document.getElementById('status').textContent = `Payment of ${document.getElementById('amount').value} EUR confirmed`
      })
    </script>
  </body>
</html>
