# Keycloak for the sign-in through an identity provider (scenarios A1-A5, A8): realm caw-e2e with the confidential clients spa-ci
# and spa-idfirst (identifier-first flow) of the spa fixture and three fictitious users, one with a one-time code. No fixed
# hostname: the browser reaches it as idp.localhost:18180 (A1) or localhost:18180 (A2), the spa server on 127.0.0.1.
services:
  idp:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin-e2e-fictitious"
      JAVA_OPTS_KC_HEAP: "-Xmx512m"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:18180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 3s
      retries: 60
